name: Validate presets and rebuild index

on:
  push:
    branches: [main]
    paths: ["presets/**", "tools/**"]
  pull_request:
    paths: ["presets/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate presets and build index.xml
        run: python tools/build_index.py
      - name: Commit index.xml
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.xml; then echo "index.xml unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.xml
          git commit -m "Rebuild preset index"
          git push
